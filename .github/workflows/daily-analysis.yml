name: Daily Trading Analysis

on:
  schedule:
    # Run at 11:30 PM IST (18:00 UTC) on weekdays
    - cron: '0 18 * * 1-5'
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Comma-separated tickers (leave empty for full universe)'
        required: false
        default: ''
      deep_count:
        description: 'Number of stocks for deep analysis'
        required: false
        default: '20'
      concurrent:
        description: 'Max concurrent analyses (phase 1)'
        required: false
        default: '20'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2 hours for deep analysis
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run two-phase analysis
        id: run_analysis
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TWELVE_DATA_KEYS: ${{ secrets.TWELVE_DATA_KEYS }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TRADINGAGENTS_LLM_PROVIDER: nvidia
          TRADINGAGENTS_DEEP_THINK_LLM: meta/llama-3.1-70b-instruct
          TRADINGAGENTS_QUICK_THINK_LLM: meta/llama-3.1-8b-instruct
          TRADINGAGENTS_TEMPERATURE: "0.1"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd bot
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            TICKERS=$(echo "${{ github.event.inputs.tickers }}" | tr ',' ' ')
            python two_phase_scheduler.py --tickers $TICKERS --deep-count ${{ github.event.inputs.deep_count || '20' }} --concurrent ${{ github.event.inputs.concurrent || '20' }}
          else
            python two_phase_scheduler.py --deep-count ${{ github.event.inputs.deep_count || '20' }} --concurrent ${{ github.event.inputs.concurrent || '20' }}
          fi

      - name: Send error notification
        if: failure() && steps.run_analysis.outcome == 'failure'
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python -c "
          import smtplib
          import os
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from datetime import datetime

          sender = os.environ['SENDER_EMAIL']
          password = os.environ['GMAIL_APP_PASSWORD']
          receiver = os.environ['RECEIVER_EMAIL']

          subject = f'Microsoft Trading Bot - ERROR {datetime.now().strftime(\"%Y-%m-%d %H:%M\")}'
          html = f'''
          <!DOCTYPE html>
          <html>
          <body style=\"margin: 0; padding: 0; background-color: #0f0f23; font-family: Segoe UI, sans-serif;\">
            <div style=\"max-width: 800px; margin: 0 auto; padding: 20px;\">
              <div style=\"background: linear-gradient(135deg, #2e1a1a 0%, #3e1616 100%); border-radius: 15px; padding: 30px; margin-bottom: 20px; border: 1px solid #ff1744;\">
                <h1 style=\"color: #ff1744; margin: 0; font-size: 28px;\">Microsoft Trading Bot</h1>
                <p style=\"color: #ff8a80; margin: 5px 0 0 0;\">ERROR REPORT</p>
                <p style=\"color: #666; margin: 5px 0 0 0; font-size: 12px;\">{datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")}</p>
              </div>
              <div style=\"background: #1a1a2e; border-radius: 10px; padding: 20px; margin: 20px 0; border: 1px solid #ff1744;\">
                <h2 style=\"color: #ff1744; margin-top: 0;\">Bot Failed</h2>
                <div style=\"background: #16213e; padding: 15px; border-radius: 8px; margin-bottom: 15px;\">
                  <div style=\"color: #ff8a80; font-size: 12px; margin-bottom: 5px;\">ERROR</div>
                  <div style=\"color: #fff; font-size: 16px;\">The two-phase analysis pipeline failed. Check GitHub Actions logs for details.</div>
                </div>
              </div>
              <div style=\"text-align: center; padding: 20px; color: #666; font-size: 12px;\">
                <p>Microsoft Trading Bot | Powered by TradingAgents + NVIDIA NIM</p>
              </div>
            </div>
          </body>
          </html>
          '''

          msg = MIMEMultipart('alternative')
          msg['Subject'] = subject
          msg['From'] = sender
          msg['To'] = receiver
          msg['Reply-To'] = sender
          msg.attach(MIMEText(html, 'html'))

          try:
              with smtplib.SMTP_SSL('smtp.gmail.com', 465) as server:
                  server.ehlo()
                  print('SMTP connected')
                  server.login(sender, password)
                  print('SMTP login successful')
                  code, resp = server.noop()
                  print(f'SMTP noop: code={code} resp={resp}')
                  if code != 250:
                      print(f'ERROR: SMTP session invalid: {code} {resp}')
                      exit(1)
                  rejects = server.sendmail(sender, receiver, msg.as_string())
                  if rejects:
                      print(f'ERROR: Email rejected: {rejects}')
                      exit(1)
                  code, resp = server.noop()
                  print(f'SMTP noop after send: code={code} resp={resp}')
              print('Error notification sent successfully')
          except smtplib.SMTPAuthenticationError as e:
              print(f'ERROR: SMTP auth failed (bad credentials?): {e}')
              exit(1)
          except smtplib.SMTPException as e:
              print(f'ERROR: SMTP error: {e}')
              exit(1)
          except Exception as e:
              print(f'ERROR: {e}')
              exit(1)
          "

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-phase-results-${{ github.run_number }}
          path: bot/results/
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-phase-logs-${{ github.run_number }}
          path: |
            bot/bot.log
            bot/scheduler.log
          retention-days: 7
