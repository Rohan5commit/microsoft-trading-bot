name: Daily Trading Analysis

on:
  schedule:
    # 18:00 UTC = 2 PM EDT (Mar-Nov) / 1 PM EST (Nov-Mar)
    # GitHub Actions cron is UTC-only; no DST support available.
    - cron: '0 18 * * 1-5'
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Comma-separated tickers (leave empty for full universe)'
        required: false
        default: ''
      deep_count:
        description: 'Number of stocks for deep analysis'
        required: false
        default: '20'

permissions:
  contents: read

concurrency:
  group: trading-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2 hours for deep analysis
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Restore persistent state
        uses: actions/cache/restore@v4
        with:
          path: |
            bot/portfolio_state.json
            bot/trades.json
          key: trading-state-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            trading-state-${{ github.ref_name }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run two-phase analysis
        id: run_analysis
        timeout-minutes: 110
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TWELVE_DATA_KEYS: ${{ secrets.TWELVE_DATA_KEYS }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TRADINGAGENTS_LLM_PROVIDER: nvidia
          TRADINGAGENTS_DEEP_THINK_LLM: meta/llama-3.1-70b-instruct
          TRADINGAGENTS_QUICK_THINK_LLM: meta/llama-3.1-8b-instruct
          TRADINGAGENTS_TEMPERATURE: "0.1"
          TRADINGAGENTS_MAX_DEBATE_ROUNDS: "1"
          TRADINGAGENTS_MAX_RISK_ROUNDS: "1"
          PYTHONPATH: ${{ github.workspace }}
          INPUT_TICKERS: ${{ github.event.inputs.tickers }}
          INPUT_DEEP_COUNT: ${{ github.event.inputs.deep_count || '20' }}
        run: |
          cd bot
          if [ -n "$INPUT_TICKERS" ]; then
            TICKERS=$(echo "$INPUT_TICKERS" | tr ',' ' ')
            python two_phase_scheduler.py --tickers $TICKERS --deep-count "$INPUT_DEEP_COUNT"
          else
            python two_phase_scheduler.py --deep-count "$INPUT_DEEP_COUNT"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-phase-results-${{ github.run_number }}
          path: bot/results/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-phase-logs-${{ github.run_number }}
          path: |
            bot/bot.log
            bot/scheduler.log
          if-no-files-found: warn
          retention-days: 7

      - name: Save persistent state
        if: steps.run_analysis.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            bot/portfolio_state.json
            bot/trades.json
          key: trading-state-${{ github.ref_name }}-${{ github.run_number }}
