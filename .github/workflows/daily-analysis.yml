name: Daily Analysis

on:
  schedule:
    # Run at 9:30 AM ET (14:30 UTC) on weekdays
    - cron: '30 14 * * 1-5'
  workflow_dispatch:  # Allow manual trigger
    inputs:
      tickers:
        description: 'Comma-separated tickers (leave empty for top 5 universe)'
        required: false
        default: ''

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 1 hour max per run
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run analysis
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TWELVE_DATA_KEYS: ${{ secrets.TWELVE_DATA_KEYS }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
          TRADINGAGENTS_LLM_PROVIDER: nvidia
          TRADINGAGENTS_DEEP_THINK_LLM: meta/llama-3.1-70b-instruct
          TRADINGAGENTS_QUICK_THINK_LLM: meta/llama-3.1-8b-instruct
          TRADINGAGENTS_TEMPERATURE: "0.1"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd bot
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            # Parse comma-separated tickers into space-separated for --tickers
            TICKERS=$(echo "${{ github.event.inputs.tickers }}" | tr ',' ' ')
            python bot.py --daily --tickers $TICKERS
          else
            python scheduler.py daily
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-results-${{ github.run_number }}
          path: bot/results/
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs-${{ github.run_number }}
          path: |
            bot/bot.log
            bot/scheduler.log
          retention-days: 7
